[project]
name = "quartermaster"
version = "0.1.0"
description = "Inventory and stock-movement API with an append-only audit log."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Puts the project root on sys.path. Without it `pytest` only works when invoked
# as `python -m pytest`, which happens to add the working directory itself — so
# the suite passes for whoever wrote it and fails for everyone who follows the
# README.
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"
# Migration bodies are written by `alembic revision --autogenerate`. Reformatting
# machine-generated code creates churn without making anything clearer, and the
# next autogenerate would undo it.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
